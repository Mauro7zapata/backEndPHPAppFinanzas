<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba POST (borrar después)</title>
<body style="font-family:sans-serif;padding:16px">
<h3>Prueba de POST al servidor</h3>
<p>Esta página está en: <b id="aqui"></b></p>
<button onclick="probar('Auth/Login.php')">Probar Login en esta carpeta</button>
<button onclick="probar('../../../PRD/BackEnd_PresupuestosApp/AppFinanzas/Auth/Login.php')">Probar Login en PRD</button>
<pre id="out" style="white-space:pre-wrap;background:#eee;padding:8px;margin-top:12px"></pre>
<script>
document.getElementById('aqui').textContent = location.href;
function probar(ruta) {
  var out = document.getElementById('out'); out.textContent = 'Enviando...';
  fetch(ruta, {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({correo: 'prueba@ejemplo.com', clave: 'Prueba123'}), redirect: 'manual'})
    .then(function (r) { return r.text().then(function (t) {
      out.textContent = 'Ruta: ' + ruta + '\nEstado: ' + r.status + '\nTipo: ' + r.type + '\nURL final: ' + r.url + '\n\n' + t; }); })
    .catch(function (e) { out.textContent = 'Error: ' + e; });
}
</script>
